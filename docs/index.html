<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171d27">
<title>Expense Tracker · Premium</title>
<meta name="theme-color" content="#1d3d31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expense Tracker">
<meta name="description" content="Personal finance tracker for income, daily expenses, borrowing, lending and notices.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{
 --bg:#f4f5fb;--surface:#ffffff;--surface2:#f8f9fd;--text:#1a1c2e;--muted:#6b6f87;--border:#e4e6f0;--grid:#cdd1e2;
 --accent:#4f46e5;--accent2:#7c3aed;--accent-soft:rgba(79,70,229,.10);
 --good:#059669;--warn:#d97706;--bad:#dc2626;
 --shadow:0 1px 2px rgba(20,20,60,.04),0 6px 20px rgba(20,20,60,.06);
 --radius:16px;
 color-scheme:light;
}
:root[data-theme="dark"]{
 --bg:#0f1020;--surface:#181a2e;--surface2:#1f2238;--text:#eceefa;--muted:#9a9db8;--border:#2a2d48;--grid:#3d4166;
 --accent:#818cf8;--accent2:#a78bfa;--accent-soft:rgba(129,140,248,.14);
 --good:#34d399;--warn:#fbbf24;--bad:#f87171;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
 color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* Header */
.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#a855f7 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 0 64px}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#312e81 0%,#4c1d95 60%,#581c87 100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
.brand h1{font-size:1.2rem;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;opacity:.8;font-weight:400}
.top-actions{display:flex;gap:8px}
.icon-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:8px 12px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{background:rgba(255,255,255,.26)}
.monthnav{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:6px}
.monthnav button{background:rgba(255,255,255,.16);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.2rem}
.monthnav strong{min-width:170px;text-align:center;font-size:1.05rem}
.profile{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.profile input{background:transparent;border:none;border-bottom:1px dashed rgba(255,255,255,.5);color:#fff;text-align:center;font-size:.85rem;padding:2px 4px;width:180px}
.profile input::placeholder{color:rgba(255,255,255,.7)}
.profile input:focus{outline:none;border-bottom-color:#fff}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-44px;margin-bottom:14px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat .lbl{font-size:.74rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat .val{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* Section nav */
.secnav{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin-bottom:6px}
.secnav .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.secnav .chips::-webkit-scrollbar{display:none}
.secnav a{flex-shrink:0;text-decoration:none;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:.8rem;font-weight:600}
.secnav a:hover{color:var(--accent);border-color:var(--accent)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:1rem;margin:0;font-weight:700}
.card p{margin:6px 0;font-size:.9rem}
.muted{color:var(--muted);font-weight:400;font-size:.82rem}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.cols2{grid-template-columns:1fr}}

/* Form controls */
.inp,select.inp{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:9px 11px;font-size:.9rem;min-width:0}
.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:.88rem;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--border);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:110px}
.del{background:none;border:none;color:var(--muted);font-size:1.1rem;padding:2px 6px;border-radius:6px}
.del:hover{color:var(--bad);background:rgba(220,38,38,.08)}

/* Daily table */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.85rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--grid);text-align:right;white-space:nowrap}
th{background:var(--surface2);font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--grid)}
th:first-child{background:var(--surface2);z-index:2}
th.sortable{cursor:pointer;user-select:none}
th:last-child,td:last-child{border-right:none}

tbody tr:hover td{background:var(--accent-soft)}
tbody tr.today td:first-child{color:var(--accent);font-weight:700}
.catdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
td input{width:68px;border:1px solid transparent;background:transparent;color:var(--text);text-align:right;padding:5px 4px;border-radius:6px}
td input:hover{border-color:var(--border)}
td input:focus{border-color:var(--accent);outline:none;background:var(--surface2)}
tfoot td{font-weight:800;border-top:2px solid var(--border);border-bottom:none;background:var(--surface2)}
tfoot td:first-child{background:var(--surface2)}
.tbarcell{position:relative;border-radius:6px;overflow:hidden;height:22px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;min-width:80px}
.tbarcell .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.22}
.tbarcell b{position:relative}

/* Lists */
.list{list-style:none;padding:0;margin:0 0 10px}
.list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.list li .meta{display:flex;align-items:center;gap:8px;min-width:0}
.list li .meta span{overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.subhead{font-size:.85rem;font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between}

/* People (borrow & lend) */
.list li.person{display:block;padding:0}
.person-head{display:flex;align-items:center;gap:8px;width:100%;padding:10px 2px;background:none;border:none;color:var(--text);text-align:left;font-size:.88rem}
.person-head.static{padding:8px 0 2px}
.person-head .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chev{width:14px;color:var(--muted)}
.person-body{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;margin:0 0 10px}
.txlist{margin:8px 0}
.tx,.txhead{display:grid;grid-template-columns:minmax(0,140px) 1fr 90px 30px;gap:6px;align-items:center;padding:4px 0;font-size:.82rem}
.tx{border-bottom:1px dashed var(--border)}
.txhead{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.tx .inp{padding:5px 7px;font-size:.82rem;width:100%}
.txkind{color:var(--muted);font-weight:600}
.audit-tx{padding:0 0 8px 10px}
.audit-tx div{display:grid;grid-template-columns:110px 1fr auto;gap:8px;font-size:.8rem;color:var(--muted);padding:2px 0}
.users-tbl td,.users-tbl th{text-align:left}
.colact{margin-left:4px;white-space:nowrap}
.colbtn{background:none;border:none;color:var(--muted);padding:0 3px;font-size:.85rem;line-height:1}
.colbtn:hover{color:var(--accent)}

/* Budget */
.budget-row{display:grid;grid-template-columns:1fr 100px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem}
.budget-row .inp{padding:6px 8px;text-align:right}
.bar{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:-2px}
.bar i{display:block;height:100%;border-radius:99px}
.badge{font-size:.7rem;padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:600;justify-self:end}
.badge.bad{color:var(--bad);background:rgba(220,38,38,.12)}
.badge.warn{color:var(--warn);background:rgba(217,119,6,.12)}
.badge.good{color:var(--good);background:rgba(5,150,105,.12)}

/* Audit */
.audit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media (max-width:640px){.audit-grid{grid-template-columns:1fr}}
.audit-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px}
.audit-box .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.audit-box .val{font-size:1.25rem;font-weight:800;margin-top:2px}
.catlist{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.catlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;font-size:.9rem;border-bottom:1px solid var(--border)}
.catlist li:nth-child(even){background:var(--surface2)}
.catlist li b{font-variant-numeric:tabular-nums}
.catlist li.tot{border-bottom:none;border-top:2px solid var(--border);background:var(--accent-soft);font-weight:700}

.plan-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:520px){.plan-inputs{grid-template-columns:1fr}}
.plan-inputs label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;font-weight:600}

footer{text-align:center;color:var(--muted);font-size:.82rem;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(20px);background:#1a1c2e;color:#fff;padding:10px 16px;border-radius:12px;font-size:.85rem;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Login / sign-up */
.gate{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 24px;background:radial-gradient(1200px 500px at 50% -10%,rgba(124,58,237,.35),transparent),var(--bg)}
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.gate-brand .logo{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.gate-brand h1{margin:0;font-size:1.25rem}
.gate-brand small{color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{border:none;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.gate form{display:flex;flex-direction:column;gap:12px}
.gate label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted)}
.gate .inp{padding:11px 12px;font-size:.95rem}
.pinwrap{position:relative;display:block}
.pinwrap .inp{width:100%;padding-right:46px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.pinwrap .inp::placeholder{letter-spacing:normal}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:8px;color:var(--muted)}
.eye:hover{color:var(--accent);background:var(--accent-soft)}
.gate-ok{color:var(--good);background:rgba(5,150,105,.1);border-radius:10px;padding:9px 11px;font-size:.85rem}
.gate-msg{color:var(--bad);font-size:.85rem;min-height:1.1em}
.gate-submit{padding:12px;font-size:.95rem}
.gate-submit:disabled{opacity:.7}
.gate a{color:var(--accent);font-weight:600}

#printArea{display:none}
@media print{
 body *{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:24px;color:#000;font-family:Arial,sans-serif}
 #printArea table{border-collapse:collapse;width:100%;margin:8px 0 16px}
 #printArea th,#printArea td{border:1px solid #999;padding:6px 8px;text-align:left;position:static;background:none;color:#000}
 #printArea td.r{text-align:right}
}

/* V4 additions */
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.chart-row{display:grid;grid-template-columns:100px 1fr 85px;gap:8px;align-items:center;margin:10px 0;font-size:.8rem}.chart-track{height:12px;border-radius:12px;background:var(--surface2);overflow:hidden}.chart-fill{height:100%;border-radius:12px;background:var(--accent)}.alert-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin:8px 0;background:var(--surface2)}.alert-item strong{display:block}.alert-item small{color:var(--muted)}.alert-tag{color:var(--warn);font-size:.72rem;font-weight:700}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.form-grid .inp{width:100%}.mobile-dock{display:none}[hidden]{display:none!important}.notice-count{display:inline-flex;min-width:19px;height:19px;align-items:center;justify-content:center;border-radius:99px;background:var(--warn);color:#fff;font-size:.7rem;margin-left:4px}
@media(max-width:700px){.dash-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}.chart-row{grid-template-columns:80px 1fr 75px}.mobile-dock{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);justify-content:space-around;padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 8px)}.mobile-dock a{font-size:.72rem;text-decoration:none;color:var(--text);text-align:center;padding:5px}.mobile-dock a span{display:block;font-size:1.25rem}body{padding-bottom:72px}.card{padding:13px}.top-actions{gap:4px}.icon-btn{padding:7px}.stats{gap:8px}.stat{padding:11px}.stat .val{font-size:1.1rem}}

.menu-wrap{position:relative}.menu-trigger{font-size:1.4rem;min-width:42px;justify-content:center}
.feature-menu{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 36px rgba(0,0,0,.2);padding:8px;z-index:100}
.feature-menu a,.feature-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:11px;border-radius:8px;text-decoration:none;font-size:.88rem}
.feature-menu a:hover,.feature-menu button:hover{background:var(--accent-soft)}
.feature-menu .menu-heading{padding:7px 11px;font-size:.73rem;color:var(--muted);font-weight:700}
.feature-menu .menu-divider{border-top:1px solid var(--border);margin:6px 0}

.primary-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px;align-items:center}
.primary-actions button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:650}
.primary-actions button.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.primary-actions .menu-wrap{margin-right:auto}
.primary-actions .menu-trigger{font-size:.9rem;min-width:auto;display:flex;gap:7px;align-items:center;background:var(--surface);color:var(--text);border:1px solid var(--border)}
.primary-actions .feature-menu{left:0;right:auto}
@media(max-width:520px){.primary-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.primary-actions button{width:100%;font-size:.83rem;padding:10px 5px}.primary-actions .menu-wrap{margin-right:0}.primary-actions .menu-trigger{justify-content:center}}

/* Premium neutral editorial theme: clear typography, no blue section headings */
:root{--bg:#f5f3ef;--surface:#fffefa;--surface2:#f7f5f0;--text:#222620;--muted:#656b62;--border:#dedbd2;--grid:#d6d0c4;--accent:#315b48;--accent2:#b18a4c;--accent-soft:rgba(49,91,72,.10);--shadow:0 3px 18px rgba(35,39,30,.055);--radius:18px}
:root[data-theme="dark"]{--bg:#151917;--surface:#202622;--surface2:#282e29;--text:#f5f2e9;--muted:#b7b9b0;--border:#3b443d;--grid:#485349;--accent:#83b99a;--accent2:#d5b579;--accent-soft:rgba(131,185,154,.12)}
.hero{background:linear-gradient(125deg,#1c2621 0%,#31473b 65%,#425547 100%);padding-bottom:66px;position:relative}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 86% 12%,rgba(216,183,113,.15),transparent 45%)}
:root[data-theme="dark"] .hero{background:linear-gradient(125deg,#111c17,#263b30)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;position:relative;z-index:2}
.brand{flex:1;min-width:0;gap:12px}
.brand h1{font-size:clamp(1.35rem,2.9vw,2.05rem);font-weight:850;letter-spacing:-.045em;line-height:1.1}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#e1c590,#ac874b);color:#1e291e;font-size:1.4rem;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.brand small{font-size:.76rem;opacity:.84;margin-top:4px}
.topbar>.menu-wrap{flex:0 0 auto;z-index:50}
.topbar .menu-trigger{font-size:.88rem;min-width:92px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.32);color:#fff;font-weight:750}
.topbar .feature-menu{left:0;right:auto;z-index:100;background:var(--surface);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.top-actions{flex-shrink:0}
.icon-btn{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.25)}
.monthnav{position:relative;z-index:1}.monthnav strong{font-size:1.17rem;font-weight:750}
.profile{position:relative;z-index:1;margin-top:16px}
.profile input{width:min(500px,90vw);font-size:clamp(1.35rem,3.6vw,2.05rem);font-weight:850;letter-spacing:-.025em;border-bottom:2px solid rgba(218,192,137,.8);padding:7px 10px;color:#fff}
.profile input::placeholder{color:rgba(255,255,255,.76)}
.card{border:1px solid var(--border);box-shadow:var(--shadow)}
.card-head{border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px}
.card-head h2{color:var(--text);font-size:clamp(1.18rem,2.4vw,1.42rem);font-weight:820;letter-spacing:-.025em}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
/* ---------- Storage ----------
   Signed-in data lives in the user's account (see Account sync below). This device key
   only holds data entered before accounts existed; it is moved into the first account
   created on this device. No data is ever in the page source or the URL. */
const STORE_NS='expTracker.demo.v1';
const DEMO_MODE=false;
const LEGACY_KEY='expTrackerData';
const SAMPLE_HASH='5d669900'; // fingerprint of the old built-in sample data
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
function newId(){try{if(crypto.randomUUID)return crypto.randomUUID();}catch(e){}return uid()+uid()+uid();}
const DEVICE_ID=(()=>{try{let id=localStorage.getItem(STORE_NS+'.device');if(!id){id=newId();localStorage.setItem(STORE_NS+'.device',id);}return id;}catch(e){return 'local';}})();
const STORE_KEY=STORE_NS+'.data.'+DEVICE_ID;
const PALETTE=['#f97316','#3b82f6','#8b5cf6','#10b981','#ef4444','#64748b','#ec4899','#14b8a6','#eab308','#06b6d4'];
const DEFAULT_CATS=[{id:'food',name:'Food',color:'#f97316'},{id:'rent',name:'Rent',color:'#3b82f6'},{id:'subscription',name:'Subscription',color:'#8b5cf6'},{id:'basicNeed',name:'Basic Need',color:'#10b981'},{id:'academic',name:'Academic',color:'#ef4444'},{id:'extra',name:'Extra',color:'#64748b'}];
const DEFAULT_INCOME_CATS=[{id:'salary',name:'Salary'},{id:'allowance',name:'Allowance'},{id:'freelance',name:'Freelance'},{id:'otherIncome',name:'Other'}];

function emptyState(){
 return {version:3,categories:DEFAULT_CATS.map(c=>({...c})),incomeCategories:DEFAULT_INCOME_CATS.map(c=>({...c})),
  months:{},budgets:{overall:0},savingsTarget:0,expectedIncome:0,profile:{name:''},theme:null,recurring:[]};
}
function hash(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16);}
function legacyFingerprint(d){try{return Object.keys(d.months||{}).sort().map(k=>{const m=d.months[k];
 const e=(m.entries||[]).flatMap(x=>Object.keys(x).filter(c=>c!=='date'&&num(x[c])).map(c=>x.date+':'+c+':'+num(x[c]))).sort().join('|');
 const inc=Array.isArray(m.incomes)?m.incomes.reduce((a,i)=>a+num(i.amount),0):num(m.income);
 const dl=t=>(m[t]||[]).map(x=>x.name+'='+num(x.amount)).join(',');
 return k+'#'+e+'#'+inc+'#'+dl('borrow')+'#'+dl('willGet');}).join('||');}catch(e){return '';}}

/* ---------- Persistence (Local Storage) ---------- */
function loadDeviceData(){
 try{const r=localStorage.getItem(STORE_KEY);if(r)return JSON.parse(r);}catch(e){}
 // One-time move from the old shared key. The untouched built-in sample is dropped
 // so it never shows up as someone's data.
 try{const r=localStorage.getItem(LEGACY_KEY);if(r){localStorage.removeItem(LEGACY_KEY);const d=JSON.parse(r);
  const untouchedSample=hash(legacyFingerprint(d))===SAMPLE_HASH&&!(d.profile&&d.profile.name);
  if(d&&d.months&&!untouchedSample)return d;}}catch(e){}
 return null;
}
function clearDeviceData(){try{localStorage.removeItem(STORE_KEY);localStorage.removeItem(LEGACY_KEY);}catch(e){}}
/* ---------- Account sync ----------
   The server keys every read/write to the logged-in account (HttpOnly session cookie),
   so one user's data can never be read or overwritten by another user. */
let currentUser=null;
const userCacheKey=()=>STORE_NS+'.user.'+currentUser.id;
function save(){
 if(!currentUser)return;
 try{localStorage.setItem(userCacheKey(),JSON.stringify(state));}catch(e){}
 if(DEMO_MODE){setSync('saved');return;}
 queueSync();
}
/* Login is kept in an HttpOnly cookie. A copy of the session token is also kept on this
   device and sent as a header, so login still works where browsers block cookies
   (e.g. when the app is shown inside another site's frame or in strict privacy modes). */
const TOKEN_KEY=STORE_NS+'.session';
const getToken=()=>{try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';}};
const setToken=t=>{try{t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY);}catch(e){}};
const SUPABASE_URL=window.EXPENSE_SUPABASE_URL||'';
const SUPABASE_PUBLISHABLE_KEY=window.EXPENSE_SUPABASE_PUBLISHABLE_KEY||'';
const sbClient=(window.supabase&&SUPABASE_URL&&SUPABASE_PUBLISHABLE_KEY&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'))
 ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}})
 : null;
const pinToAuthPassword=pin=>'ExpenseTracker!'+String(pin)+'!2026';
function apiResponse(status,payload){return {status,ok:status>=200&&status<300,json:async()=>payload};}
function apiError(status,error){return apiResponse(status,{error:String(error||'Request failed')});}
async function currentAuthUser(){
 const {data,error}=await sbClient.auth.getUser();
 if(error)throw error;
 return data?.user||null;
}
async function appUser(authUser){
 if(!authUser)return null;
 const {data,error}=await sbClient.from('profiles').select('id,email,username,display_name,is_admin,created_at').eq('id',authUser.id).maybeSingle();
 if(error)throw error;
 const p=data||{};
 return {id:authUser.id,identifier:authUser.email||p.email||'',username:p.username||authUser.user_metadata?.username||'',name:p.display_name||authUser.user_metadata?.display_name||authUser.email?.split('@')[0]||'User',isOwner:!!p.is_admin,registeredAt:p.created_at||authUser.created_at||null};
}
async function api(path,opts={}){
 if(!sbClient)return apiError(503,'Supabase configuration is missing. Add your Project URL and Publishable Key in docs/supabase-config.js.');
 const method=String(opts.method||'GET').toUpperCase();
 let body={};
 try{body=opts.body?JSON.parse(opts.body):{};}catch(_){return apiError(400,'Invalid request data.');}
 try{
  if(path==='/api/auth/signup'&&method==='POST'){
   const email=String(body.email||'').trim().toLowerCase(),username=String(body.username||'').trim(),pin=String(body.password||'');
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return apiError(400,'Enter a valid email address.');
   if(!/^[A-Za-z0-9._]{3,20}$/.test(username))return apiError(400,'Username must be 3–20 letters, numbers, dots or underscores.');
   if(!/^\d{5}$/.test(pin))return apiError(400,'PIN must be exactly 5 digits.');
   const {data,error}=await sbClient.auth.signUp({email,password:pinToAuthPassword(pin),options:{data:{username,display_name:username},emailRedirectTo:window.location.href.split('#')[0]}});
   if(error)return apiError(error.status||400,error.message);
   return apiResponse(201,{email,needsEmailConfirmation:!data.session});
  }
  if(path==='/api/auth/login'&&method==='POST'){
   const identifier=String(body.identifier||'').trim().toLowerCase(),pin=String(body.password||'');
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(identifier))return apiError(400,'Please log in with the email address you registered with.');
   if(!/^\d{5}$/.test(pin))return apiError(400,'PIN must be exactly 5 digits.');
   const {data,error}=await sbClient.auth.signInWithPassword({email:identifier,password:pinToAuthPassword(pin)});
   if(error)return apiError(error.status||401,error.message==='Invalid login credentials'?'Incorrect email or PIN.':error.message);
   const user=await appUser(data.user);
   return apiResponse(200,{user});
  }
  if(path==='/api/auth/me'&&method==='GET'){
   const authUser=await currentAuthUser();
   if(!authUser)return apiError(401,'Please log in.');
   return apiResponse(200,{user:await appUser(authUser)});
  }
  if(path==='/api/auth/logout'&&method==='POST'){
   const {error}=await sbClient.auth.signOut();
   if(error)return apiError(500,error.message);
   return apiResponse(200,{ok:true});
  }
  const authUser=await currentAuthUser();
  if(!authUser)return apiError(401,'Please log in.');
  const user=await appUser(authUser);
  if(path==='/api/auth/profile'&&method==='POST'){
   const name=String(body.name||'').trim().slice(0,100);
   if(!name)return apiError(400,'Name is required.');
   const {error}=await sbClient.from('profiles').update({display_name:name}).eq('id',authUser.id);
   if(error)return apiError(400,error.message);
   return apiResponse(200,{user:{...user,name}});
  }
  if(path==='/api/data'&&method==='GET'){
   const {data,error}=await sbClient.from('user_data').select('data').eq('user_id',authUser.id).maybeSingle();
   if(error)return apiError(400,error.message);
   return apiResponse(200,{data:data?.data??null});
  }
  if(path==='/api/data'&&method==='PUT'){
   if(!body.data||typeof body.data!=='object'||Array.isArray(body.data)||!body.data.months||typeof body.data.months!=='object')return apiError(400,'Invalid data format.');
   const {error}=await sbClient.from('user_data').upsert({user_id:authUser.id,data:body.data},{onConflict:'user_id'});
   if(error)return apiError(400,error.message);
   return apiResponse(200,{ok:true});
  }
  if(path==='/api/notices'&&method==='GET'){
   const {data,error}=await sbClient.from('announcements').select('id,title,message,created_at').eq('active',true).order('created_at',{ascending:false}).limit(100);
   if(error)return apiError(400,error.message);
   return apiResponse(200,{notices:data||[]});
  }
  if(path==='/api/admin/notices'&&method==='POST'){
   if(!user.isOwner)return apiError(403,'Only the owner can publish notices.');
   const title=String(body.title||'').trim(),message=String(body.message||'').trim();
   if(!title||title.length>120||!message||message.length>2000)return apiError(400,'Title and message are required.');
   const {data,error}=await sbClient.from('announcements').insert({title,message,created_by:authUser.id,active:true}).select('id,title,message,created_at').single();
   if(error)return apiError(400,error.message);
   return apiResponse(201,{notice:data});
  }
  const deleteMatch=path.match(/^\/api\/admin\/notices\/([0-9a-f-]{36})$/i);
  if(deleteMatch&&method==='DELETE'){
   if(!user.isOwner)return apiError(403,'Only the owner can delete notices.');
   const {error}=await sbClient.from('announcements').delete().eq('id',deleteMatch[1]);
   if(error)return apiError(400,error.message);
   return apiResponse(200,{ok:true});
  }
  if(path==='/api/admin/users'&&method==='GET'){
   if(!user.isOwner)return apiError(403,'Not authorized.');
   const {data,error}=await sbClient.from('profiles').select('id,email,username,display_name,created_at').order('created_at',{ascending:false});
   if(error)return apiError(400,error.message);
   return apiResponse(200,{users:(data||[]).map(p=>({id:p.id,name:p.display_name||'',username:p.username||'',email:p.email||'',registeredAt:p.created_at,lastLoginAt:null}))});
  }
  return apiError(404,'Endpoint not found.');
 }catch(error){
  const message=error?.message||'Could not connect to Supabase.';
  const status=message.toLowerCase().includes('not authenticated')?401:500;
  return apiError(status,message);
 }
}
let syncTimer=null,syncing=false,syncAgain=false,syncState='saved';
function setSync(st){syncState=st;const el=document.getElementById('syncState');if(el)el.textContent=syncLabel();}
function syncLabel(){if(DEMO_MODE)return '✓ Demo saved on this device';return {saved:'✓ Saved to your account',saving:'Saving…',offline:'Offline — will retry',error:'Could not save — retrying'}[syncState]||'';}
function queueSync(){clearTimeout(syncTimer);setSync('saving');syncTimer=setTimeout(pushNow,700);}
async function pushNow(){
 clearTimeout(syncTimer);syncTimer=null;
 if(!currentUser)return;
 if(syncing){syncAgain=true;return;}
 syncing=true;
 try{
  const r=await api('/api/data',{method:'PUT',body:JSON.stringify({data:state})});

function xlDate(ds){const d=new Date(ds+'T00:00:00');return d.getDate()+'-'+d.toLocaleString('en',{month:'short'})+'-'+String(d.getFullYear()).slice(-2);}
function monthSheet(key){
 const m=getMonth(key),cs=cats(),rows=monthRows(key).sort((a,b)=>a.date<b.date?-1:1),dim=rows.length,totals=calcTotals(m),inc=incomeTotal(m);
 const cDT=1+cs.length,cMT=cDT+1,cB=cMT+1,cW=cB+1,last=cW;
 const sh=newSheet(monthLabel(key));
 sh.widths=[11,...cs.map(()=>12),12,15,24,24];
 ['Date',...cs.map(c=>c.name),'Daily Total','Monthly total','Borrow','I will get'].forEach((h,i)=>sh.set(0,i,h,X.head));
 for(let c=0;c<=last;c++)sh.set(1,c,c===0?new Date(key+'-01T00:00:00').toLocaleString('en',{month:'long'}):'',X.title);
 sh.merge(1,0,1,last);sh.heights[1]=22;
 const dayLines=(arr,type)=>{const by={};(arr||[]).forEach(p=>sortedTx(p).forEach(t=>{const d=t.date.slice(0,7)===key?t.date:key+'-01';
  (by[d]=by[d]||[]).push(t.amount<0?`${p.name} ${DEBT_WORDS[type].sub.toLowerCase()} ${Math.abs(num(t.amount))}`:`${p.name}=${num(t.amount)}`);}));return by;};
 const bl=dayLines(m.borrow,'borrow'),wl=dayLines(m.willGet,'willGet');
 const mtSpan=Math.max(1,dim-4);
 rows.forEach((e,i)=>{
  const r=2+i,isToday=e.date===todayStr;
  sh.set(r,0,xlDate(e.date),isToday?X.red:X.c);
  cs.forEach((c,j)=>{const v=num(e[c.id]);sh.set(r,1+j,v||'',X.c);});
  sh.set(r,cDT,calcDayTotal(e),isToday?X.red:X.c);
  sh.set(r,cMT,'',X.c);
  sh.set(r,cB,(bl[e.date]||[]).join(', '),X.c);
  sh.set(r,cW,(wl[e.date]||[]).join(', '),X.c);
 });
 sh.set(2,cMT,totals.total,X.c);sh.merge(2,cMT,2+mtSpan-1,cMT);
 if(dim>mtSpan+1){sh.set(2+mtSpan,cMT,'Income:',X.l);sh.set(3+mtSpan,cMT,inc,X.r);}
 const tr=2+dim;
 sh.set(tr,0,'Total:',X.totL);
 cs.forEach((c,j)=>sh.set(tr,1+j,totals[c.id],X.totN));
 sh.set(tr,cDT,'Revenue:',X.totB);
 sh.set(tr,cMT,inc-totals.total,X.totN);
 sh.set(tr,cB,(m.borrow||[]).length?'Total='+debtTotal(m.borrow):'',X.totB);
 sh.set(tr,cW,(m.willGet||[]).length?'Total='+debtTotal(m.willGet):'',X.totB);
 ['Date',...cs.map(c=>c.name),'Daily Total','Monthly total','Borrow','I will get'].forEach((h,i)=>sh.set(tr+1,i,h,X.head));
 sh.set(tr+3,0,'© 2026 Musharrof Hussain',X.def);
 return sh;
}

 };

 people('Borrowed (I owe)','borrow',a.m.borrow||[],'Total Borrowed (still owed)',a.borrowed);

/* V4: cross-month outstanding debt reminders, without modifying original ledger */
function outstanding(asOf=currentMonth){
 const result=[];
 Object.keys(state.months).sort().filter(k=>k<=asOf).forEach(k=>{
  ['borrow','willGet'].forEach(type=>(getMonth(k)[type]||[]).forEach(p=>{
   const bal=personBal(p);
   if(bal>0.00001)result.push({month:k,type,person:p,balance:bal});
  }));
 });return result;
}
function settleDebt(origin,type,pid){
 const p=(getMonth(origin)[type]||[]).find(x=>x.id===pid);if(!p)return;
 const balance=personBal(p);if(balance<=0)return;
 const answer=prompt(`Record ${type==='borrow'?'repayment':'money received'} for ${p.name} (remaining ${fmt(balance)}). Enter amount:`,String(balance));
 if(answer===null)return;
 const amount=Number(answer);
 if(!Number.isFinite(amount)||amount<=0||amount>balance+0.00001){toast('Enter an amount up to the outstanding balance');return;}
 p.tx.push({id:uid(),date:todayStr,amount:-amount,note:'Settled in '+thisMonth});
 save();render();toast(personBal(p)<=0?'Settled — reminder cleared; history kept':'Partial payment recorded');
}

 <p class="muted">Unpaid balances from previous months stay here until settled. Partial payments reduce the reminder. Fully settled records remain in their original month’s history.</p>
 ${items.length?items.map(x=>`<div class="alert-item"><div><strong>${esc(x.person.name)} <span class="alert-tag">${x.type==='borrow'?'YOU OWE':'OWED TO YOU'}</span></strong><small>Since ${monthLabel(x.month)} · ${x.person.tx.length} ledger entries</small></div><div style="text-align:right"><b>${fmt(x.balance)}</b><div><button class="btn sm" onclick="settleDebt('${x.month}','${x.type}','${x.person.id}')">${x.type==='borrow'?'Repay':'Received'}</button></div></div></div>`).join(''):'<p class="good">✓ No outstanding balances for this month.</p>'}
 </section>`;
}
function addRecurring(){
 const name=cleanName(document.getElementById('recName').value),cat=document.getElementById('recCat').value,amount=Number(document.getElementById('recAmount').value),day=Number(document.getElementById('recDay').value);
 if(!name||!Number.isFinite(amount)||amount<=0||!Number.isInteger(day)||day<1||day>31){toast('Enter a name, positive amount and day (1–31)');return;}
 state.recurring.push({id:uid(),name,cat,amount,day,start:currentMonth,active:true});applyRecurring(currentMonth);save();render();toast('Recurring expense created');
}
function toggleRecurring(id){const r=state.recurring.find(x=>x.id===id);if(r){r.active=!r.active;save();render();}}
function deleteRecurring(id){if(!confirm('Remove recurring rule? Existing transactions will be kept.'))return;state.recurring=state.recurring.filter(x=>x.id!==id);save();render();}
function applyRecurring(key){
 if(!Array.isArray(state.recurring))return;
 const m=ensureMonth(key);let changed=false;
 state.recurring.filter(r=>r.active&&r.start<=key).forEach(r=>{
  const day=Math.min(r.day,monthDates(key).length),date=key+'-'+String(day).padStart(2,'0');
  if(!Array.isArray(m.recurringApplied))m.recurringApplied=[];
  if(m.recurringApplied.includes(r.id))return;
  let e=m.entries.find(x=>x.date===date);if(!e){e={date};m.entries.push(e);}e[r.cat]=num(e[r.cat])+num(r.amount);
  m.recurringApplied.push(r.id);changed=true;
 });if(changed)save();
}

function gateHTML(msg){
 const su=gateMode==='signup';
 return `<div class="gate-card">
  <div class="gate-brand"><div class="logo">৳</div><div><h1>Expense Tracker</h1><small>${su?'Create your account':'Welcome back'}</small></div></div>

function showGate(msg){
 const g=document.getElementById('gate');document.getElementById('app').innerHTML='';
 g.hidden=false;
 g.innerHTML=msg===null?'<div class="gate-card"><p class="muted" style="text-align:center">Loading…</p></div>':gateHTML(msg);
 const f=g.querySelector(gatePrefill&&gateMode==='login'?'input[name=password]':'input');if(f)f.focus();
}
function setGate(m){gateMode=m;gateNotice='';showGate('');}
async function submitGate(ev){
 ev.preventDefault();if(gateBusy)return;
 const f=new FormData(ev.target),v=k=>String(f.get(k)||'');
 const su=gateMode==='signup';
 const body=su?{email:v('email').trim(),username:v('username').trim(),password:v('password')}:{identifier:v('identifier').trim(),password:v('password')};
 if(su){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.email))return gateError('Enter a valid email address.',ev.target);
  if(!/^[A-Za-z0-9._]{3,20}$/.test(body.username))return gateError('Username must be 3–20 letters, numbers, dots or underscores.',ev.target);
 }else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.identifier))return gateError('Enter the email address you registered with.',ev.target);
 if(!/^\d{5}$/.test(body.password))return gateError('PIN must be exactly 5 digits.',ev.target);
 if(su&&body.password!==v('confirm'))return gateError('PINs do not match.',ev.target);
 gateBusy=true;ev.target.querySelector('.gate-submit').disabled=true;ev.target.querySelector('.gate-submit').textContent='Please wait…';
 try{
  const r=await api('/api/auth/'+gateMode,{method:'POST',body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  gateBusy=false;
  if(!r.ok)return gateError(j.error||'Something went wrong. Please try again.',ev.target);
  if(su){gateMode='login';gatePrefill=j.email||body.email;gateNotice=j.needsEmailConfirmation?'Account created! Check your email and confirm it before logging in.':'Account created! Log in with your email and PIN.';showGate('');return;}
  gatePrefill='';gateNotice='';
  if(j.token)setToken(j.token);
  await startSession(j.user,true);
 }catch(e){gateBusy=false;gateError('Could not reach the server. Check your connection.',ev.target);}
}
function gateError(msg,form){
 const el=form.querySelector('.gate-msg');el.textContent=msg;
 const b=form.querySelector('.gate-submit');b.disabled=false;b.textContent=gateMode==='signup'?'Create account':'Log in';
}
async function startSession(user,justLoggedIn){
 currentUser=user;
 let d=null,fromServer=false;
 try{const r=await api('/api/data');if(r.status===401){currentUser=null;setToken('');showGate(justLoggedIn?'Login worked, but this browser blocked the session. Please allow cookies/site data for this site and try again.':'');return;}if(r.ok){d=(await r.json()).data;fromServer=true;}}catch(e){}
 if(!fromServer){try{d=JSON.parse(localStorage.getItem(userCacheKey())||'null');}catch(e){}if(d)toast('Offline — showing your last saved copy');}
 let isNew=false;
 if(!d&&fromServer){d=loadDeviceData();isNew=true;}   // brand-new account: adopt any data entered on this device before accounts existed
 state=migrate(d);
 if(!state.profile.name||isNew)state.profile.name=user.name||user.username||'';
 if(isNew)clearDeviceData();
 currentMonth=state.lastMonth&&/^\d{4}-\d{2}$/.test(state.lastMonth)?state.lastMonth:thisMonth;
 sortState={key:'date',dir:'asc'};openPeople.clear();window._auditMonth=null;
 document.getElementById('gate').hidden=true;document.getElementById('gate').innerHTML='';
 applyTheme();render();
 try{localStorage.setItem(userCacheKey(),JSON.stringify(state));}catch(e){}
 if(isNew)pushNow();else setSync('saved');
 fetchGlobalNotices();
}
async function logout(){
 if(DEMO_MODE){if(confirm('Reset the demo? This deletes demo data saved in this browser.')){localStorage.removeItem(userCacheKey());state=emptyState();currentMonth=thisMonth;render();}return;}
 if(syncTimer||syncState!=='saved')await pushNow();
 try{await api('/api/auth/logout',{method:'POST'});}catch(e){}
 setToken('');
 try{if(currentUser)localStorage.removeItem(userCacheKey());}catch(e){}
 currentUser=null;ownerUsers=null;state=emptyState();gateMode='login';applyTheme();showGate('');toast('Logged out');
}
function sessionExpired(){
 setToken('');
 try{if(currentUser)localStorage.removeItem(userCacheKey());}catch(e){}
 currentUser=null;state=emptyState();gateMode='login';showGate('Your session has expired. Please log in again.');
}
async function boot(){
 if(DEMO_MODE){currentUser={id:'demo',identifier:'Demo account',username:'demo',name:'Demo User',isOwner:false};try{state=migrate(JSON.parse(localStorage.getItem(userCacheKey())||'null'));}catch(e){state=emptyState();}currentMonth=state.lastMonth||thisMonth;applyRecurring(currentMonth);applyTheme();document.getElementById('gate').hidden=true;render();return;}
 applyTheme();showGate(null);
 if(!sbClient){showGate('Supabase setup is incomplete. Add the Project URL and Publishable Key in supabase-config.js, then reload.');return;}
 try{const r=await api('/api/auth/me');if(r.ok){await startSession((await r.json()).user);return;}}catch(e){}
 showGate('');
}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;const btn=document.getElementById('installAppBtn');if(btn)btn.classList.add('available');});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;});
async function installPwa(){if(!deferredInstallPrompt){alert('On Android Chrome, open the browser menu and choose Install app or Add to Home screen.');return;}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
boot();
</script>
